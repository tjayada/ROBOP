# Panda-ORB evaluation.

defaults:
  - estimator: nemo
  - robot: panda
  - dataset: panda_orb
  - override hydra/job_logging: default
  - _self_

checkpoint: ???
seed: 0

# Path to detections JSON from robot-detector/run_detect.py.
# The default NeMO estimator uses crop_mode: bbox and raises without a detection;
# pass a file, or run detector-free with estimator.crop_mode=bootstrap.
# null is valid for FoundPose (falls back to centre-crop, no TF-IDF mask filtering).
detections_path: null

# Joint-noise perturbation (evaluation/joint_noise.py; sweep via +experiment=ablation_joint_noise).
# magnitude_deg = total joint-space L2 in degrees; 0.0 = disabled (exact no-op).
joint_noise:
  magnitude_deg: 0.0
  seed: 12345

# How many debug overlay images to save per run (0 to disable).
num_overlays: 0

# null = every frame (~32k), which is what the final numbers use; spread it across
# GPUs with frame_shard below. Set to an int N < dataset size to evaluate N
# evenly-spaced frames instead (e.g. N=1000 ~ every 32nd frame) - a smoke test, or
# FoundPose, whose per-frame cost makes the full split infeasible. When detections
# are supplied the N frames are drawn from the frames the detections file covers,
# so any N works with a subsampled detections file.
num_eval_frames: null

# Split the (post-num_eval_frames) selection into M disjoint blocks and evaluate
# only block k, so the 32k run can be spread across GPUs. Each task needs a unique
# output directory; run_panda_orb_shard.sh enforces OUTPUT_ROOT/shard_k. Combine
# the completed set with evaluation/merge_shards.py. null = one unsharded job.
frame_shard: null

save_results: ${hydra:runtime.output_dir}/results.json

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_${hydra:runtime.choices.estimator}_${hydra:runtime.choices.dataset}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}_${hydra:runtime.choices.dataset}
    subdir: ${hydra.job.num}
